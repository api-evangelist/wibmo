aid: wibmo
name: WIBMO
description: 'Wibmo is a full-stack PayTech company (acquired by PayU / Naspers in 2019) providing
  payment security, digital payments, and digital financial services to banks, fintechs, and
  businesses worldwide. Its platforms and products include the Areion Payment Gateway, Token Hub
  tokenization, Trident FRM fraud risk management, Tridentity identity and multi-factor
  authentication, the ACCOSA IVS 3-D Secure authentication server, and a white-label digital wallet
  and prepaid card-issuing platform. The Wibmo developer portal documents Token Hub, Payment Gateway
  (3-D Secure authentication and authorization), Prepaid card issuance and lifecycle management, Fraud
  Risk Management, DFS/Wallet, and Android and iOS MFA (Tridentity) SDKs.'
